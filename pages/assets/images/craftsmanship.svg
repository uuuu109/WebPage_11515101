<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="craftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <radialGradient id="fireCenter" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="charcoalColor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#44403c"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#craftGrad)"/>
  <circle cx="400" cy="300" r="280" fill="url(#fireCenter)"/>

  <!-- Geometric Japanese Traditional Pattern (Seigaiha / Waves hint) in background -->
  <g stroke="#44403c" stroke-width="1.5" opacity="0.25" fill="none">
    <path d="M 0,150 Q 50,110 100,150 Q 150,110 200,150 Q 250,110 300,150 Q 350,110 400,150 Q 450,110 500,150 Q 550,110 600,150 Q 650,110 700,150 Q 750,110 800,150"/>
    <path d="M 0,200 Q 50,160 100,200 Q 150,160 200,200 Q 250,160 300,200 Q 350,160 400,200 Q 450,160 500,200 Q 550,160 600,200 Q 650,160 700,200 Q 750,160 800,200"/>
  </g>

  <!-- Charcoal Logs (備長炭) -->
  <g transform="translate(250, 360)">
    <!-- Charcoal 1 -->
    <rect x="0" y="20" width="130" height="32" rx="10" transform="rotate(-10)" fill="url(#charcoalColor)" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Glowing embers on log 1 -->
    <ellipse cx="60" cy="30" rx="30" ry="6" fill="#ef4444" opacity="0.8"/>
    <ellipse cx="60" cy="30" rx="15" ry="3" fill="#fde047"/>

    <!-- Charcoal 2 -->
    <rect x="160" y="0" width="140" height="34" rx="12" transform="rotate(8)" fill="url(#charcoalColor)" stroke="#f59e0b" stroke-width="1.5"/>
    <ellipse cx="230" cy="18" rx="35" ry="7" fill="#ef4444" opacity="0.8"/>
    <ellipse cx="230" cy="18" rx="18" ry="3" fill="#fde047"/>

    <!-- Charcoal 3 Center Base -->
    <rect x="70" y="30" width="160" height="36" rx="12" fill="url(#charcoalColor)" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="150" cy="48" rx="45" ry="8" fill="#f97316" opacity="0.9"/>
    <ellipse cx="150" cy="48" rx="25" ry="4" fill="#fef08a"/>
  </g>

  <!-- Grill Net (燒烤網格) -->
  <g stroke="#a8a29e" stroke-width="2" opacity="0.8">
    <line x1="200" y1="260" x2="600" y2="260"/>
    <line x1="200" y1="280" x2="600" y2="280"/>
    <line x1="200" y1="300" x2="600" y2="300"/>
    <!-- Diagonals -->
    <line x1="220" y1="250" x2="270" y2="310"/>
    <line x1="280" y1="250" x2="330" y2="310"/>
    <line x1="340" y1="250" x2="390" y2="310"/>
    <line x1="400" y1="250" x2="450" y2="310"/>
    <line x1="460" y1="250" x2="510" y2="310"/>
    <line x1="520" y1="250" x2="570" y2="310"/>
  </g>

  <!-- Grilled Saba Silhouette on Grill -->
  <g transform="translate(280, 200)">
    <!-- Fish Body -->
    <path d="M 30,50 Q 120,15 220,50 Q 120,80 30,50 Z" fill="#b45309" stroke="#f59e0b" stroke-width="3"/>
    <!-- Tail Fin -->
    <polygon points="20,50 0,30 5,50 0,70" fill="#92400e" stroke="#f59e0b" stroke-width="2"/>
    <!-- Charcoal Grill Marks -->
    <line x1="70" y1="30" x2="85" y2="68" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <line x1="110" y1="28" x2="125" y2="70" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="32" x2="165" y2="68" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <line x1="185" y1="38" x2="195" y2="62" stroke="#1c1917" stroke-width="4" stroke-linecap="round"/>
    <!-- Crispy Golden Highlights -->
    <path d="M 50,45 Q 120,30 200,48" stroke="#fde047" stroke-width="2.5" fill="none" opacity="0.8"/>
  </g>

  <!-- Charcoal Sparks & Rising Sizzle -->
  <circle cx="340" cy="180" r="3" fill="#fde047"/>
  <circle cx="430" cy="160" r="2.5" fill="#f59e0b"/>
  <circle cx="460" cy="140" r="3.5" fill="#fef08a"/>
  <circle cx="380" cy="130" r="2" fill="#fde047"/>
  <circle cx="410" cy="110" r="3" fill="#f97316"/>

  <!-- Smoke -->
  <path d="M 360,190 Q 340,140 370,100 T 360,50" stroke="#fef3c7" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round"/>
  <path d="M 440,190 Q 470,140 430,90 T 450,40" stroke="#fde047" stroke-width="2.5" fill="none" opacity="0.25" stroke-linecap="round"/>

  <!-- Header Label Badge -->
  <rect x="260" y="40" width="280" height="42" rx="21" fill="#141210" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="67" font-family="'Noto Serif TC', serif" font-size="16" font-weight="900" fill="#fef08a" text-anchor="middle">
    1000° 備長炭高溫瞬烤工藝
  </text>
</svg>
